server:
  port: 7099

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${user.home}/logs/seata

# Seata 控制台配置（可选，如果不需要可以注释掉）
console:
  user:
    username: admin
    password: admin

seata:
  config:
    # 使用 nacos 作为配置中心
    type: nacos
    nacos:
      server-addr: 117.72.198.60:8848
      namespace: 830ebeac-0e0b-45bf-bea3-1ea3d02827c4
      group: DEFAULT_GROUP
      data-id: seataServer.properties
  
  registry:
    # 使用 nacos 作为注册中心
    type: nacos
    nacos:
      application: seata-server
      server-addr: 117.72.198.60:8848
      group: DEFAULT_GROUP
      namespace: 830ebeac-0e0b-45bf-bea3-1ea3d02827c4
      cluster: default
  
  store:
    # 存储模式
    mode: file
  
  security:
    secretKey: SeataSecretKey0c382ef121d778043159209298fd40bf3850a017
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/api/v1/auth/login
  
  server:
    service-port: 8099

