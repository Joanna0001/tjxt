services:
  xxl-job:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxljob
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      PARAMS: '--spring.datasource.url=jdbc:mysql://14.103.164.47:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai 
              --spring.datasource.username=root 
              --spring.datasource.password=P@55w0rd#k9jL$2Xq
              --xxl.job.accessToken=tianji
              -Xms200m
              -Xmx200m'
    volumes:
      - ./xxljob/logs:/app/log
      - ./xxljob/data:/app/data
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.3"
        reservations:
          memory: 200m
          cpus: "0.2"
    networks:
      - leadnews_network

  # kibana
  kibana:
    image: kibana:7.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=100
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    deploy:
      resources:
        limits:
          memory: 120m
          cpus: "0.2"
    networks:
      - leadnews_network

  # elasticsearch 
  elasticsearch:
    image: elasticsearch:7.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms128m -Xmx128m
      - bootstrap.memory_lock=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_plugins:/usr/share/elasticsearch/plugins
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          memory: 300m
          cpus: "0.6"
    networks:
      - leadnews_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672"  # Web管理界面
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150m
          cpus: "0.3"
    networks:
      - leadnews_network

  seata:
    image: seataio/seata-server:1.5.2
    container_name: seata
    restart: unless-stopped
    ports:
      - "8099:8099" # 事务服务端口
      - "7099:7099" # 控制台端口
    environment:
      SEATA_IP: 117.72.198.60
      JVM_XMS: 218m
      JVM_XMX: 218m
    volumes:
      - ./seata:/seata-server/resources
    privileged: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 250m
          cpus: "0.5"
    networks:
      - leadnews_network

  # Nacos - 优化内存配置
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 优化 JVM 内存设置
      JVM_XMS: 300m
      JVM_XMX: 300m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
    deploy:
      resources:
        limits:
          memory: 750m  # 限制最大内存使用
          cpus: "0.5"
        reservations:
          memory: 350m
          cpus: "0.3"
    networks:
      - leadnews_network

  # Nginx - 优化配置
  nginx:
    image: nginx:1.27.5-alpine  # 使用 Alpine 版本减少镜像大小
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/html:/opt/docker-app/nginx/html
    ports:
      - "80:80"
      - "443:443"
      - "18080:18080"
      - "18081:18081"
    depends_on:
      - nacos
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 30m
          cpus: "0.2"
        reservations:
          memory: 20m
          cpus: "0.1"
    networks:
      - leadnews_network

volumes:
  es_data:
  es_plugins:
  # mongodb_data:
  rabbitmq_data:

networks:
  leadnews_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450