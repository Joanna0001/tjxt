version: '3.8'

services:
  # 认证服务
  tj-auth-service:
    image: registry.cn-hangzhou.aliyuncs.com/tjxt_backend/tj-auth-service:latest
    container_name: tj-auth-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always
    networks:
      - tjxt-network

  # 网关服务
  tj-gateway:
    image: registry.cn-hangzhou.aliyuncs.com/tjxt_backend/tj-gateway:latest
    container_name: tj-gateway
    ports:
      - "10010:10010"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: always
    networks:
      - tjxt-network
    depends_on:
      - tj-auth-service

  # 用户服务
  tj-user:
    image: registry.cn-hangzhou.aliyuncs.com/tjxt_backend/tj-user:latest
    container_name: tj-user
    ports:
      - "8082:8082"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always
    networks:
      - tjxt-network

  # 课程服务
  tj-course:
    image: registry.cn-hangzhou.aliyuncs.com/tjxt_backend/tj-course:latest
    container_name: tj-course
    ports:
      - "8086:8086"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: always
    networks:
      - tjxt-network

  # 考试服务
  tj-exam:
