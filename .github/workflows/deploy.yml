name: tjxtBackend-Optimized

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      services:
        description: '要部署的服务（用逗号分隔，留空则部署全部）'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Xmx3072m
  DOCKER_REGISTRY: ghcr.io/joanna0001

jobs:
  # 检测哪些服务发生了变化
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      user: ${{ steps.filter.outputs.user }}
      course: ${{ steps.filter.outputs.course }}
      exam: ${{ steps.filter.outputs.exam }}
      data: ${{ steps.filter.outputs.data }}
      learning: ${{ steps.filter.outputs.learning }}
      media: ${{ steps.filter.outputs.media }}
      message: ${{ steps.filter.outputs.message }}
      pay: ${{ steps.filter.outputs.pay }}
      search: ${{ steps.filter.outputs.search }}
      trade: ${{ steps.filter.outputs.trade }}
      common: ${{ steps.filter.outputs.common }}
      any_service_changed: ${{ steps.check.outputs.any_changed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'tj-auth/**'
            gateway:
              - 'tj-gateway/**'
            user:
              - 'tj-user/**'
            course:
              - 'tj-course/**'
            exam:
              - 'tj-exam/**'
            data:
              - 'tj-data/**'
            learning:
              - 'tj-learning/**'
            media:
              - 'tj-media/**'
            message:
              - 'tj-message/**'
            pay:
              - 'tj-pay/**'
            search:
              - 'tj-search/**'
            trade:
              - 'tj-trade/**'
            common:
              - 'tj-common/**'
              - 'tj-api/**'
              - 'pom.xml'
      
      - name: Check if any service changed
        id: check
        run: |
          if [ "${{ steps.filter.outputs.auth }}" == "true" ] || \
             [ "${{ steps.filter.outputs.gateway }}" == "true" ] || \
             [ "${{ steps.filter.outputs.user }}" == "true" ] || \
             [ "${{ steps.filter.outputs.course }}" == "true" ] || \
             [ "${{ steps.filter.outputs.exam }}" == "true" ] || \
             [ "${{ steps.filter.outputs.data }}" == "true" ] || \
             [ "${{ steps.filter.outputs.learning }}" == "true" ] || \
             [ "${{ steps.filter.outputs.media }}" == "true" ] || \
             [ "${{ steps.filter.outputs.message }}" == "true" ] || \
             [ "${{ steps.filter.outputs.pay }}" == "true" ] || \
             [ "${{ steps.filter.outputs.search }}" == "true" ] || \
             [ "${{ steps.filter.outputs.trade }}" == "true" ] || \
             [ "${{ steps.filter.outputs.common }}" == "true" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

  # 构建所有发生变化的模块
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_service_changed == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-files
          path: |
            tj-auth/tj-auth-service/target/*.jar
            tj-gateway/target/*.jar
            tj-user/target/*.jar
            tj-course/target/*.jar
            tj-exam/target/*.jar
            tj-data/target/*.jar
            tj-learning/target/*.jar
            tj-media/target/*.jar
            tj-message/tj-message-service/target/*.jar
            tj-pay/tj-pay-service/target/*.jar
            tj-search/target/*.jar
            tj-trade/target/*.jar
          retention-days: 1

  # 构建和推送 Docker 镜像 - Auth Service
  build-auth:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-files
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Prepare and Build
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp tj-auth/tj-auth-service/target/*.jar docker-context/app.jar
      - uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/tj-auth-service:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/tj-auth-service:latest

  # Gateway Service
  build-gateway:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-files
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Prepare and Build
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp tj-gateway/target/*.jar docker-context/app.jar
      - uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/tj-gateway:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/tj-gateway:latest

  # User Service
  build-user:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-files
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Prepare and Build
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp tj-user/target/*.jar docker-context/app.jar
      - uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/tj-user:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/tj-user:latest

  # Course Service
  build-course:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.course == 'true' || needs.detect-changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
