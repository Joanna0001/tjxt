name: tjxtBackend

on:
  push:
    branches: [ dev ]  # 或者你的分支名

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 部署到服务器
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/project
          git pull origin dev
          npm install --production
          pm2 restart tjxtBackend