name: tjxtBackend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx3072m
  DOCKER_REGISTRY: ghcr.io/joanna0001

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: jar-files
          path: |
            tj-auth/tj-auth-service/target/*.jar
            tj-gateway/target/*.jar
            tj-user/target/*.jar
            tj-course/target/*.jar
            tj-exam/target/*.jar
            tj-data/target/*.jar
            tj-learning/target/*.jar
            tj-media/target/*.jar
            tj-message/tj-message-service/target/*.jar
            tj-pay/tj-pay-service/target/*.jar
            tj-search/target/*.jar
            tj-trade/target/*.jar
          retention-days: 1

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - name: tj-auth-service
            path: tj-auth/tj-auth-service
          - name: tj-gateway
            path: tj-gateway
          - name: tj-user
            path: tj-user
          - name: tj-course
            path: tj-course
          - name: tj-exam
            path: tj-exam
          - name: tj-data
            path: tj-data
          - name: tj-learning
            path: tj-learning
          - name: tj-media
            path: tj-media
          - name: tj-message-service
            path: tj-message/tj-message-service
          - name: tj-pay-service
            path: tj-pay/tj-pay-service
          - name: tj-search
            path: tj-search
          - name: tj-trade
            path: tj-trade
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: jar-files
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp ${{ matrix.service.path }}/target/*.jar docker-context/app.jar
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # 登录 GitHub Container Registry
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # 进入部署目录
            cd /opt/project/tjxt
            
            # 拉取最新镜像
            docker pull ghcr.io/joanna0001/tj-auth-service:latest
            docker pull ghcr.io/joanna0001/tj-gateway:latest
            docker pull ghcr.io/joanna0001/tj-user:latest
            docker pull ghcr.io/joanna0001/tj-course:latest
            docker pull ghcr.io/joanna0001/tj-exam:latest
            docker pull ghcr.io/joanna0001/tj-data:latest
            docker pull ghcr.io/joanna0001/tj-learning:latest
            docker pull ghcr.io/joanna0001/tj-media:latest
            docker pull ghcr.io/joanna0001/tj-message-service:latest
            docker pull ghcr.io/joanna0001/tj-pay-service:latest
            docker pull ghcr.io/joanna0001/tj-search:latest
            docker pull ghcr.io/joanna0001/tj-trade:latest
            
            # 停止并删除旧容器
            docker-compose down
            
            # 启动新容器
            docker-compose up -d
            
            # 清理未使用的镜像
            docker image prune -f
      
      - name: Deployment notification
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Services deployed: tj-auth-service, tj-gateway, tj-user, tj-course, tj-exam, tj-data, tj-learning, tj-media, tj-message-service, tj-pay-service, tj-search, tj-trade"